# Two listeners with separate authentication (design §5.1, §5.6).
per_listener_settings true
persistence true
persistence_location /mosquitto/data/

# Devices: mutual TLS; the certificate CN is the username; ACL limits each device to its own topic.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.3
acl_file /mosquitto/config/devices.acl

# Services and recipients: TLS plus username/password managed by the dynamic-security plugin.
listener 8884
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
tls_version tlsv1.3
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
