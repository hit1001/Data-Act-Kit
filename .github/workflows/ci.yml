name: CI
on: [push, pull_request]
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:tap
      - run: npm run test:it
      - name: Requirements traceability (design §11)
        run: npm run trace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compliance-evidence, path: traceability-matrix.md }

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t dataact-kit .
      - run: docker build -f Dockerfile.edge -t dataact-kit-edge .
      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx > sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
